<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="Food Command Center: feed everybody, know what you need.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Food HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Food Command Center</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--green:#22c55e;--red:#ef4444;--yellow:#facc15;--blue:#3b82f6;--purple:#8b5cf6;--pink:#ec4899;--orange:#f97316;--gold:#f59e0b;--icy:#7dd3fc;--teal:#14b8a6;
--bg:#0f172a;--card:#1e293b;--card2:#273449;--text:#f8fafc;--muted:#a5b4c8;--r:18px;--shadow:0 8px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#0f172a 0%,#1e1b4b 55%,#0f172a 100%);background-attachment:fixed;color:var(--text);min-height:100dvh;line-height:1.4;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 20px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:var(--text);background:#0b1222;border:2px solid #334155;border-radius:14px;padding:12px 14px;width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple)}
h1{font-size:1.25rem;font-weight:850;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:800;margin-bottom:10px}
h3{font-size:1rem;font-weight:800}
.muted{color:var(--muted);font-size:.9rem}
.small{font-size:.82rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top .hi{font-size:.9rem;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.06);border-left:6px solid var(--c,#475569)}
.c-green{--c:var(--green)}.c-red{--c:var(--red)}.c-yellow{--c:var(--yellow)}.c-blue{--c:var(--blue)}.c-purple{--c:var(--purple)}.c-pink{--c:var(--pink)}.c-orange{--c:var(--orange)}.c-gold{--c:var(--gold)}.c-icy{--c:var(--icy)}.c-teal{--c:var(--teal)}
.tonight{background:linear-gradient(170deg,#3b1a78 0%,var(--card) 70%);border:2px solid var(--purple);border-left-width:6px}
.badge{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;margin-bottom:8px;background:var(--c,#475569);color:#0b1222}
.badge.on-dark{color:#fff}
.big-title{font-size:1.45rem;font-weight:900;line-height:1.2}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.giant{display:block;width:100%;border-radius:20px;padding:16px 12px;font-weight:900;font-size:1.05rem;color:#fff;box-shadow:var(--shadow);min-height:70px;line-height:1.2;transition:transform .1s}
.giant:active,.btn:active,.chip:active,.tile:active{transform:scale(.96)}
.giant .sub{display:block;font-size:.78rem;font-weight:700;opacity:.92;margin-top:3px}
.g-feed{background:linear-gradient(135deg,#7c3aed,#c026d3);font-size:1.45rem;min-height:92px;letter-spacing:.02em;margin-bottom:10px}
.g-need{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.g-mark{background:linear-gradient(135deg,#fb923c,#ea580c)}
.tile{border-radius:18px;padding:12px 6px;font-weight:850;font-size:.86rem;color:#fff;min-height:76px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;line-height:1.15}
.tile .e{font-size:1.5rem}
.t-teal{background:linear-gradient(135deg,#14b8a6,#0f766e)}.t-pink{background:linear-gradient(135deg,#ec4899,#be185d)}.t-green{background:linear-gradient(135deg,#22c55e,#15803d)}
.t-purple{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.t-gold{background:linear-gradient(135deg,#f59e0b,#b45309)}.t-slate{background:linear-gradient(135deg,#475569,#334155)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:11px 14px;font-weight:800;font-size:.95rem;background:var(--card2);color:#fff;min-height:46px;border:1px solid rgba(255,255,255,.08)}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:7px 11px;font-size:.82rem;border-radius:12px}
.btn.green{background:var(--green);color:#052e16}.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.purple{background:var(--purple)}.btn.yellow{background:var(--yellow);color:#422006}
.btn.orange{background:var(--orange);color:#1c0a00}.btn.pink{background:var(--pink)}.btn.gold{background:var(--gold);color:#1c0a00}.btn.icy{background:var(--icy);color:#082f49}.btn.teal{background:var(--teal);color:#042f2e}
.btn.ghost{background:transparent;border:1px solid #475569}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:12px 16px;font-weight:850;background:#0b1222;border:2px solid #334155;min-height:50px;font-size:1rem}
.chip.on{background:var(--c,var(--purple));border-color:#fff;color:#0b1222}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.person{background:var(--card);border-radius:16px;padding:12px;border-top:5px solid var(--c);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.person .who{font-weight:900;color:var(--c);font-size:1rem}
.person .plate{font-size:.92rem;font-weight:650}
.person .meta{font-size:.76rem;color:var(--muted)}
.wont{font-size:.75rem;font-weight:800;color:#fecaca;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:6px 8px;align-self:flex-start}
.plates{display:grid;gap:8px;margin:10px 0}
.plate-row{background:rgba(255,255,255,.05);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--c);flex-wrap:wrap}
.plate-row .nm{font-weight:900;min-width:58px;color:var(--c)}
.plate-row .tx{flex:1;font-weight:600;min-width:140px}
.steps{margin:8px 0 4px 0;padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-weight:600;border-bottom:1px dashed rgba(255,255,255,.08)}
.steps li:before{content:counter(s);background:var(--purple);color:#fff;font-weight:900;border-radius:50%;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.item:last-child{border-bottom:none}
.item .nm{flex:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .why{display:block;font-size:.74rem;color:var(--muted);font-weight:600}
.qty{border-radius:999px;padding:6px 10px;font-weight:850;font-size:.78rem;white-space:nowrap;border:2px solid transparent}
.q-Lots{background:#14532d;color:#bbf7d0}.q-Some{background:#365314;color:#d9f99d}.q-Almost{background:#713f12;color:#fef08a}.q-1{background:#7f1d1d;color:#fecaca}.q-num{background:#1e3a8a;color:#bfdbfe}
.check{width:40px;height:40px;border-radius:12px;border:3px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.check.on{background:var(--green);border-color:var(--green)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--card2);font-weight:900;font-size:1.1rem}
.stepper span{min-width:22px;text-align:center;font-weight:800}
.store-h{font-weight:900;font-size:1.05rem;margin:4px 0 2px;display:flex;align-items:center;gap:8px}
.dept-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;margin-top:10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tab{border-radius:14px;padding:12px 6px;font-weight:900;background:var(--card);border:2px solid transparent;min-height:54px}
.tab.on{background:var(--c);color:#0b1222;border-color:#fff}
.tell{display:flex;gap:8px;margin-bottom:12px}
.tell input{flex:1;min-width:0}
.mic{min-width:52px;border-radius:14px;background:var(--pink);font-size:1.3rem}
.mic.listening{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(236,72,153,.35)}}
.go{min-width:56px;border-radius:14px;background:var(--purple);font-weight:900}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,.97);border-top:1px solid #334155;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(8px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:800;color:var(--muted);padding:6px 0;border-radius:12px}
.nav button .e{font-size:1.35rem}
.nav button.on{color:#fff;background:rgba(139,92,246,.25)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#111827;border:2px solid var(--purple);border-radius:16px;padding:12px 14px;max-width:min(520px,94vw);width:max-content;z-index:30;box-shadow:var(--shadow);font-weight:700;display:flex;gap:10px;align-items:center}
.toast .msg{flex:1}
.welcome{background:linear-gradient(135deg,#7c3aed,#ec4899);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.welcome h2{margin-bottom:6px}
.att{display:flex;gap:8px;align-items:center;font-weight:700;padding:4px 0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex-shrink:0}
.verdict{border-radius:18px;padding:18px;text-align:center;font-weight:900;font-size:1.6rem;margin-top:10px;color:#0b1222}
.v-gold{background:var(--gold)}.v-green{background:var(--green)}.v-red{background:var(--red);color:#fff}
.money{font-size:2rem;font-weight:900}
.bar{height:16px;border-radius:999px;background:#0b1222;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--yellow))}
.pbrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.pbrow label{font-size:.7rem;font-weight:800;color:var(--muted)}
.pbrow input{padding:8px;font-size:15px}
.ph{background:#78350f;color:#fde68a;font-size:.65rem;font-weight:900;border-radius:6px;padding:2px 6px;letter-spacing:.04em}
.rec{background:#14532d;color:#bbf7d0;font-size:.65rem;font-weight:900;border-radius:6px;padding:2px 6px}
details{margin-top:6px}
summary{cursor:pointer;font-weight:800;color:var(--muted);padding:6px 0}
.lunch-slot{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0b1222;border-radius:14px;padding:12px;margin-bottom:8px;border:2px solid #334155;width:100%;text-align:left}
.lunch-slot b{color:var(--pink);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;min-width:56px}
.lunch-slot span{flex:1;font-weight:800}
.mealcard{background:var(--card2);border-radius:14px;padding:12px;margin-top:10px}
.miss{color:#fecaca;font-weight:800;font-size:.85rem}
.empty{color:var(--muted);font-weight:700;padding:8px 0}
hr{border:none;border-top:1px solid rgba(255,255,255,.08);margin:12px 0}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav">
  <button data-go="home"><span class="e">🏠</span>Home</button>
  <button data-go="shop"><span class="e">🛒</span>Shop</button>
  <button data-go="inv"><span class="e">🥫</span>Have</button>
  <button data-go="make"><span class="e">💡</span>Make</button>
  <button data-go="more"><span class="e">⚙️</span>More</button>
</nav>
<div id="toast" class="toast hide"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
